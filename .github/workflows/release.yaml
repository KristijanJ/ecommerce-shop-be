name: release

on:
  push:
    branches: [main]
    # a docs-only merge does not need a new image
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: kristijan92/ecommerce-shop-be
  GITOPS_REPO: KristijanJ/ecommerce-shop-gitops
  GITOPS_KUSTOMIZATION: apps/backend/envs/homelab/kustomization.yaml

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-gitops:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: ecommerce-shop-gitops
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.app.outputs.token }}
      - name: Set the new image tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' "$GITOPS_KUSTOMIZATION"
          git diff
      - name: Open a pull request in the gitops repo
        env:
          # the App token, so the pull request starts the validate workflow
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.build.outputs.tag }}
          BRANCH: bump/backend-homelab
        run: |
          # Nothing to do if the overlay already has this tag, for example on a re-run
          if git diff --quiet; then
            echo "The overlay already has tag $TAG"
            exit 0
          fi

          TITLE="backend: homelab -> $TAG"
          BODY="Image built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"

          # One branch per service. A newer build replaces one that is still open.
          git push --force origin "$BRANCH"

          open_prs=$(gh pr list --repo "$GITOPS_REPO" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open_prs" -eq 0 ]; then
            gh pr create --repo "$GITOPS_REPO" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr edit "$BRANCH" --repo "$GITOPS_REPO" --title "$TITLE" --body "$BODY"
          fi

          # Merge when the checks pass. If the pull request can already be merged, merge it now.
          gh pr merge "$BRANCH" --repo "$GITOPS_REPO" --auto --squash \
            || gh pr merge "$BRANCH" --repo "$GITOPS_REPO" --squash
